; Every call — inbound from CallerDesk, or one we originate — goes to the bot
; through callerdesk_bridge.py (AudioSocket on 127.0.0.1:9092).
;
; The proposal id rides in the AudioSocket UUID: 00000000-0000-4000-8000-<12 digits>.
; No id (a plain inbound call) = the bot runs the generic call, never a guess.

[from-callerdesk]
; CallerDesk rings our agent: answer and hand the audio to the bot.
; If CallerDesk sends the proposal in a SIP header, read it here, e.g.
;   same => n,Set(PROPOSAL_ID=${PJSIP_HEADER(read,X-Proposal-Id)})
exten => _X.,1,Goto(ai-bot,s,1)
exten => s,1,Goto(ai-bot,s,1)

[ai-bot]
exten => s,1,Answer()
 same => n,Set(PID=${FILTER(0-9,${PROPOSAL_ID})})
 same => n,AudioSocket(00000000-0000-4000-8000-${SPRINTF(%012d,${IF($["${PID}" = ""]?0:${PID})})},127.0.0.1:9092)
 same => n,Hangup()

; Outbound (we dial the customer through CallerDesk). Originate from the CLI or AMI:
;   asterisk -rx "channel originate PJSIP/9876543210@callerdesk extension s@ai-bot"
; with the proposal set on the channel, via AMI:
;   Action: Originate / Channel: PJSIP/9876543210@callerdesk / Context: ai-bot
;   Exten: s / Priority: 1 / Variable: PROPOSAL_ID=859623
