; Asterisk Manager Interface — only so callerdesk_bridge.py can start outbound
; calls (`python callerdesk_bridge.py dial <phone> <proposal>`). Localhost only.
; Set the same user/secret in voicebot/server/.env as AMI_USER / AMI_SECRET.

[general]
enabled = yes
port = 5038
bindaddr = 127.0.0.1

[aibot]
secret = CHANGE_ME
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
read = call
write = originate
