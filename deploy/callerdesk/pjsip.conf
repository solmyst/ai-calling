; Our Asterisk registers on CallerDesk's Asterisk exactly like MicroSIP does.
; Values from "CallerDesk + AI Bot Integration Guide": server 192.168.3.11:5060,
; username = password = agent number with leading 0. Reached over the
; site-to-site tunnel, so 192.168.3.11 must route through it (ping it first).
;
; Replace AGENT_NUMBER below (3 places) with the agent number CallerDesk gives us.
; One registration normally carries ONE call at a time — ask CallerDesk for one
; agent number per concurrent call we want, and copy the three sections per agent.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[callerdesk-reg]
type = registration
transport = transport-udp
outbound_auth = callerdesk-auth
server_uri = sip:192.168.3.11:5060
client_uri = sip:AGENT_NUMBER@192.168.3.11
retry_interval = 30
expiration = 300

[callerdesk-auth]
type = auth
auth_type = userpass
username = AGENT_NUMBER
password = AGENT_NUMBER

[callerdesk-aor]
type = aor
contact = sip:192.168.3.11:5060
qualify_frequency = 30

[callerdesk]
type = endpoint
transport = transport-udp
context = from-callerdesk
disallow = all
; G.711 both ways, 8 kHz — the bot's phone path is 8 kHz end to end.
allow = ulaw,alaw
outbound_auth = callerdesk-auth
aors = callerdesk-aor
from_user = AGENT_NUMBER
direct_media = no
rtp_symmetric = yes
dtmf_mode = rfc4733

[callerdesk-identify]
type = identify
endpoint = callerdesk
match = 192.168.3.11
