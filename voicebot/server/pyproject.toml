[project]
name = "voicebot"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    # websocket = Exotel/Plivo FastAPI media streams. assemblyai/sarvam/elevenlabs/
    # groq/openai are what bot.py imports; without them a clean `uv sync` ImportErrors.
    # Still no lock file — pin when you next freeze the env.
    "pipecat-ai[piper,runner,silero,webrtc,whisper,websocket,assemblyai,sarvam,elevenlabs,groq]>=1.4.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]