# Same question as smoke.yaml, but through the EARS.
#
# smoke.yaml runs in text modality: the user's turns are injected as text and the
# STT never runs. That is why it passed while live calls sat silent — the break
# was between "transcript exists" and "LLM runs", which only the audio path
# exercises. Kokoro synthesises the caller's speech locally, so real VAD, real
# turn detection and the real Park+ ASR all run.
name: smoke_audio
# Top-level, not per-turn: this is how the whole scenario switches to the audio
# path. Kokoro synthesises the caller locally, so the bot's real VAD, turn
# detection and Park+ ASR all run.
user:
  modality: audio
  speech:
    service: kokoro
    voice: hf_alpha
judge:
  eval:
    factory: "judge_llm.make_judge"
  # Judge stays in TEXT modality on purpose. Transcribing the bot's own speech
  # back (judge modality: audio) needs moonshine and only tests the TTS voice;
  # the thing this file exists to catch is on the INPUT side — real audio, real
  # VAD, real STT — and that is set by the `user:` block above.
turns:
  - expect:
      - event: response
        eval: "the bot opens the call: it greets, gives a name, and says it is an AI assistant"

  - user: "मेरी Creta है"
    expect:
      - event: response
        eval: "the bot replies about the customer's car or the car spa service — it does not stay silent"
